name: Generate ASCII Laser Animation

on:
  push:
    paths:
      - 'Sachinxcode-01.jpg'
      - 'generate_ascii_laser.py'
      - '.github/workflows/ascii-laser.yml'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ascii-laser:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow numpy

      - name: Generate ASCII Laser GIF
        run: |
          python generate_ascii_laser.py

      - name: Commit and Push Updated GIF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update ASCII laser animation [skip ci]"
          file_pattern: "assets/ascii-laser-intro.gif"
