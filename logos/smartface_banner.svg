<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%" role="img" aria-label="SmartFace Attendance System — Enterprise Biometric Security">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0A1021" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="neonTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="neonViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0" />
      <stop offset="85%" stop-color="#22D3EE" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowTeal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="hudGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Clip Paths -->
    <clipPath id="cardClip">
      <rect x="2" y="2" width="1196" height="456" rx="20" />
    </clipPath>
    <clipPath id="faceScanClip">
      <rect x="740" y="60" width="400" height="340" rx="16" />
    </clipPath>
  </defs>

  <style>
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Container & Card Shell -->
  <rect x="2" y="2" width="1196" height="456" rx="20" fill="url(#bgGrad)" stroke="rgba(34,211,238,0.3)" stroke-width="1.8"/>

  <g clip-path="url(#cardClip)">
    <!-- Circuit Grid Background -->
    <g opacity="0.06" stroke="#22D3EE" stroke-width="1">
      <line x1="0" y1="80" x2="1200" y2="80" />
      <line x1="0" y1="160" x2="1200" y2="160" />
      <line x1="0" y1="240" x2="1200" y2="240" />
      <line x1="0" y1="320" x2="1200" y2="320" />
      <line x1="0" y1="400" x2="1200" y2="400" />
      <line x1="150" y1="0" x2="150" y2="460" />
      <line x1="300" y1="0" x2="300" y2="460" />
      <line x1="450" y1="0" x2="450" y2="460" />
      <line x1="600" y1="0" x2="600" y2="460" />
      <line x1="750" y1="0" x2="750" y2="460" />
      <line x1="900" y1="0" x2="900" y2="460" />
      <line x1="1050" y1="0" x2="1050" y2="460" />
    </g>

    <!-- Top Status Bar -->
    <rect x="0" y="0" width="1200" height="42" fill="#070B16" />
    <line x1="0" y1="42" x2="1200" y2="42" stroke="rgba(34,211,238,0.22)" stroke-width="1" />
    
    <!-- Window controls -->
    <circle cx="28" cy="21" r="5.5" fill="#EF4444" />
    <circle cx="48" cy="21" r="5.5" fill="#F59E0B" />
    <circle cx="68" cy="21" r="5.5" fill="#10B981" />

    <text x="100" y="25" class="font-mono" font-size="11.5" fill="#64748B" letter-spacing="1">SYSTEM.SECURITY // BIOMETRIC_NODE_01</text>
    
    <g transform="translate(1030, 14)">
      <circle cx="10" cy="7" r="4" fill="#10B981">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="24" y="11" class="font-mono" font-size="11.5" font-weight="700" fill="#10B981" letter-spacing="1.5">ONLINE // 99.7%</text>
    </g>

    <!-- ================= LEFT COLUMN: HERO CONTENT ================= -->
    <g transform="translate(60, 80)">
      <!-- Badge Pill -->
      <rect x="0" y="0" width="230" height="26" rx="13" fill="rgba(34,211,238,0.12)" stroke="rgba(34,211,238,0.35)" />
      <circle cx="14" cy="13" r="3.5" fill="#22D3EE" filter="url(#hudGlow)" />
      <text x="28" y="17" class="font-mono" font-size="10.5" font-weight="700" fill="#22D3EE" letter-spacing="2">ARCFACE 512-D PIPELINE</text>

      <!-- Main Title -->
      <text x="0" y="68" class="font-sans" font-size="38" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">
        SmartFace <tspan fill="url(#neonTeal)">Attendance</tspan>
      </text>

      <!-- Subtitle -->
      <text x="0" y="104" class="font-sans" font-size="16" font-weight="400" fill="#94A3B8">
        Enterprise Real-Time Facial Recognition &amp; Biometric Security Platform
      </text>

      <!-- Core Highlights Pills Row -->
      <g transform="translate(0, 134)">
        <!-- Pill 1: Flutter -->
        <rect x="0" y="0" width="96" height="28" rx="6" fill="#0B132B" stroke="rgba(2,117,194,0.5)" />
        <text x="48" y="18" class="font-mono" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">Flutter 3.x</text>

        <!-- Pill 2: FastAPI -->
        <rect x="106" y="0" width="96" height="28" rx="6" fill="#0B132B" stroke="rgba(0,150,136,0.5)" />
        <text x="154" y="18" class="font-mono" font-size="11" font-weight="600" fill="#2DD4BF" text-anchor="middle">FastAPI</text>

        <!-- Pill 3: ArcFace AI -->
        <rect x="212" y="0" width="112" height="28" rx="6" fill="#0B132B" stroke="rgba(16,185,129,0.5)" />
        <text x="268" y="18" class="font-mono" font-size="11" font-weight="600" fill="#34D399" text-anchor="middle">ArcFace AI</text>

        <!-- Pill 4: MongoDB -->
        <rect x="334" y="0" width="100" height="28" rx="6" fill="#0B132B" stroke="rgba(71,162,72,0.5)" />
        <text x="384" y="18" class="font-mono" font-size="11" font-weight="600" fill="#4ADE80" text-anchor="middle">MongoDB</text>
      </g>

      <!-- Telemetry Metric Cards -->
      <g transform="translate(0, 186)">
        <!-- Metric Card 1 -->
        <rect x="0" y="0" width="180" height="92" rx="10" fill="#0B1224" stroke="rgba(34,211,238,0.22)" />
        <text x="16" y="24" class="font-mono" font-size="9.5" fill="#64748B" letter-spacing="1">ACCURACY BENCHMARK</text>
        <text x="16" y="58" class="font-sans" font-size="28" font-weight="800" fill="#F8FAFC">99.7<tspan font-size="18" fill="#10B981">%</tspan></text>
        <text x="16" y="78" class="font-mono" font-size="9.5" fill="#10B981">&#9650; LFW Verified</text>

        <!-- Metric Card 2 -->
        <rect x="194" y="0" width="180" height="92" rx="10" fill="#0B1224" stroke="rgba(34,211,238,0.22)" />
        <text x="210" y="24" class="font-mono" font-size="9.5" fill="#64748B" letter-spacing="1">MATCH LATENCY</text>
        <text x="210" y="58" class="font-sans" font-size="28" font-weight="800" fill="#F8FAFC">&lt; 180<tspan font-size="18" fill="#22D3EE">ms</tspan></text>
        <text x="210" y="78" class="font-mono" font-size="9.5" fill="#22D3EE">&#9679; Vector Search</text>

        <!-- Metric Card 3 -->
        <rect x="388" y="0" width="180" height="92" rx="10" fill="#0B1224" stroke="rgba(34,211,238,0.22)" />
        <text x="404" y="24" class="font-mono" font-size="9.5" fill="#64748B" letter-spacing="1">SPOOF REJECTION</text>
        <text x="404" y="58" class="font-sans" font-size="28" font-weight="800" fill="#F8FAFC">0.1<tspan font-size="18" fill="#A78BFA">%</tspan></text>
        <text x="404" y="78" class="font-mono" font-size="9.5" fill="#A78BFA">&#9733; FAR Anti-Spoof</text>
      </g>

      <!-- Terminal Command Snippet -->
      <g transform="translate(0, 302)">
        <rect x="0" y="0" width="568" height="34" rx="7" fill="#060A14" stroke="rgba(255,255,255,0.08)" />
        <text x="16" y="22" class="font-mono" font-size="12" fill="#22D3EE">$ docker compose up -d</text>
        <text x="220" y="22" class="font-mono" font-size="12" fill="#64748B"># Spins up FastAPI + MongoDB vector cluster</text>
      </g>
    </g>

    <!-- ================= RIGHT COLUMN: INTERACTIVE HUD & SCANNER ================= -->
    <g transform="translate(730, 65)">
      <!-- Outer HUD Viewport Frame -->
      <rect x="0" y="0" width="410" height="345" rx="16" fill="#070C1A" stroke="rgba(34,211,238,0.35)" stroke-width="1.5" />
      <rect x="6" y="6" width="398" height="333" rx="12" fill="#0A1022" />

      <!-- Viewport Header -->
      <rect x="6" y="6" width="398" height="28" rx="12" fill="#0B1428" />
      <text x="20" y="24" class="font-mono" font-size="10" font-weight="700" fill="#22D3EE" letter-spacing="1.5">HUD // RETINAFACE_DETECTOR_FEED</text>
      <circle cx="388" cy="20" r="3" fill="#10B981">
        <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite" />
      </circle>

      <!-- Biometric Mesh Graphics & Reticle -->
      <g id="biometric-mesh" transform="translate(45, 45)">
        <!-- Target Bounding Box Corners -->
        <g stroke="#22D3EE" stroke-width="3" fill="none">
          <path d="M 40 70 L 40 40 L 70 40" />
          <path d="M 280 70 L 280 40 L 250 40" />
          <path d="M 40 210 L 40 240 L 70 240" />
          <path d="M 280 210 L 280 240 L 250 240" />
        </g>

        <!-- Face Silhouette Outer Oval -->
        <ellipse cx="160" cy="140" rx="72" ry="94" fill="none" stroke="rgba(34,211,238,0.25)" stroke-width="1.5" stroke-dasharray="4 4" />
        <ellipse cx="160" cy="140" rx="60" ry="80" fill="none" stroke="rgba(167,139,250,0.3)" stroke-width="1.2" />

        <!-- Biometric Facial Landmarks & Lines -->
        <g stroke="rgba(34,211,238,0.4)" stroke-width="1" fill="none">
          <!-- Forehead to Cheeks -->
          <line x1="160" y1="70" x2="120" y2="115" />
          <line x1="160" y1="70" x2="200" y2="115" />
          <!-- Eye Line & Bridge -->
          <line x1="120" y1="115" x2="160" y2="125" />
          <line x1="200" y1="115" x2="160" y2="125" />
          <line x1="120" y1="115" x2="200" y2="115" />
          <!-- Nose Bridge & Tip -->
          <line x1="160" y1="125" x2="160" y2="155" />
          <!-- Nose to Mouth -->
          <line x1="160" y1="155" x2="135" y2="180" />
          <line x1="160" y1="155" x2="185" y2="180" />
          <line x1="135" y1="180" x2="185" y2="180" />
          <!-- Mouth to Chin -->
          <line x1="135" y1="180" x2="160" y2="210" />
          <line x1="185" y1="180" x2="160" y2="210" />
          <!-- Cheeks to Jaw -->
          <line x1="105" y1="140" x2="135" y2="180" />
          <line x1="215" y1="140" x2="185" y2="180" />
          <line x1="105" y1="140" x2="160" y2="210" />
          <line x1="215" y1="140" x2="160" y2="210" />
        </g>

        <!-- Landmark Nodes (Pulsing Circles) -->
        <g fill="#22D3EE" filter="url(#hudGlow)">
          <circle cx="160" cy="70" r="3.2" />
          <circle cx="120" cy="115" r="3.5" fill="#10B981" />
          <circle cx="200" cy="115" r="3.5" fill="#10B981" />
          <circle cx="160" cy="125" r="2.8" />
          <circle cx="160" cy="155" r="3.5" fill="#22D3EE" />
          <circle cx="135" cy="180" r="3" />
          <circle cx="185" cy="180" r="3" />
          <circle cx="160" cy="210" r="3.8" fill="#10B981" />
          <circle cx="105" cy="140" r="2.8" />
          <circle cx="215" cy="140" r="2.8" />
        </g>

        <!-- Live Laser Scanning Beam -->
        <g clip-path="url(#faceScanClip)">
          <rect x="30" y="30" width="260" height="40" fill="url(#scanGrad)">
            <animate attributeName="y" values="30;210;30" dur="3.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" />
          </rect>
          <line x1="30" y1="70" x2="290" y2="70" stroke="#10B981" stroke-width="2" filter="url(#glowTeal)">
            <animate attributeName="y1" values="70;250;70" dur="3.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" />
            <animate attributeName="y2" values="70;250;70" dur="3.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" />
          </line>
        </g>

        <!-- Biometric Match Box Overlay -->
        <g transform="translate(68, 248)">
          <rect x="0" y="0" width="184" height="24" rx="4" fill="rgba(16,185,129,0.18)" stroke="#10B981" stroke-width="1" />
          <text x="92" y="16" class="font-mono" font-size="10.5" font-weight="700" fill="#10B981" text-anchor="middle" letter-spacing="1">
            MATCH: EMP_8921 [99.4%]
          </text>
        </g>
      </g>

      <!-- Bottom HUD Status Line -->
      <g transform="translate(18, 318)">
        <text x="0" y="12" class="font-mono" font-size="9.5" fill="#64748B">FPS: 60.0 &bull; MODEL: ArcFace-R50 &bull; ENCRYPTION: SHA-256</text>
      </g>
    </g>
  </g>
</svg>
